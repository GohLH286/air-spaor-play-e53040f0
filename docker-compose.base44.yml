# Base44 sandbox development stack.
# Runs the TanStack Start dev server straight from the cloned source (bind mount),
# so source edits hot-reload without rebuilding an image.
name: app

services:
  web:
    build:
      context: "${BASE44_PROJECT_ROOT}"
      dockerfile: "${BASE44_PROJECT_ROOT}/Dockerfile.base44"
    working_dir: /workspace
    restart: on-failure
    # Dependencies live in a named volume; sync from the committed bun.lock at start.
    command:
      - sh
      - -ec
      - |
        bun install --frozen-lockfile --no-progress
        exec bun ./node_modules/vite/bin/vite.js dev --host 0.0.0.0 --port 3000
    ports:
      - "3000:3000"
    volumes:
      - "${BASE44_PROJECT_ROOT}:/workspace"
      - web_node_modules:/workspace/node_modules
    env_file:
      - "${BASE44_PROJECT_ROOT}/.env"
      - /run/base44/app.env
    environment:
      - BASE44_PREVIEW_MODE
      - NODE_ENV=development
      - CHOKIDAR_USEPOLLING=1
      # Vite appends this value as a single allowed-host pattern, so it must be one host.
      - __VITE_ADDITIONAL_SERVER_ALLOWED_HOSTS=.${BASE44_SANDBOX_HOST_DOMAIN:-}
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 15s
      timeout: 5s
      retries: 6
      start_period: 120s

volumes:
  web_node_modules:
